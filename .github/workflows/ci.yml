name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:quality
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node --test dist/test/*.test.js dist/test/*/*.test.js
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
  packed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package:artifact
  real-model-consumer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      NEKO_MODEL_CACHE: ${{ runner.temp }}/neko-consumer-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prefetch pinned assets for the offline packed consumer
        run: |
          node --input-type=module -e '
            import { createNeko } from "./dist/node/index.js";
            const neko = await createNeko({ device: "cpu", modelProfile: "default", cacheDir: process.env.NEKO_MODEL_CACHE });
            try { await neko.cache.model.prefetch(); } finally { await neko.dispose(); }
          '
      - run: npm run test:package
  real-model-quality:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run pinned real-model CPU quality fixtures
        run: npm run quality:benchmark -- --runtime node --device cpu --model-profile default --allow-network --cache-dir "${{ runner.temp }}/neko-quality-cache" --output artifacts/quality-raw.json
      - name: Enforce versioned quality policy
        if: always()
        run: npm run quality:gate -- --input artifacts/quality-raw.json --output artifacts/quality-diagnostics.json
      - name: Preserve raw model outputs and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-quality
          path: artifacts/quality-*.json
          if-no-files-found: error
